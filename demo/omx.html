<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>map-sdk — appearance 'omx'</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: 'Open Sans', 'Segoe UI', system-ui, sans-serif;
			color: #1D2739;
			background: #fff;
		}
		/* A task-pane-shaped layout: the map on top, the room list below, the
		   way the Outlook add-in hosts it. */
		.pane {
			display: flex;
			flex-direction: column;
			height: 100vh;
			max-width: 420px;
			border-right: 1px solid #e5e7eb;
		}
		#map { flex: 0 0 42%; min-height: 200px; }
		/* The add-in's bottom sheet + RoomCard (cx_map views/outlook
		   RoomFinderSheet.css / RoomCard.css), so the demo reads like the pane. */
		:root { --rf-accent: #0066da; }
		.list {
			position: relative;
			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
			padding: 0 12px 12px;
			margin-top: -14px;
			z-index: 1;
			background: #fff;
			border-top-left-radius: 16px;
			border-top-right-radius: 16px;
			box-shadow: 0 -6px 20px rgba(29, 39, 57, 0.08);
			font-size: 13px;
		}
		.handle { width: 36px; height: 4px; margin: 8px auto 6px; border-radius: 999px; background: #cfd6df; }
		.rf-group { padding-top: 4px; }
		.rf-group__header {
			display: flex; align-items: center; gap: 8px; width: 100%;
			padding: 10px 2px; border: none; background: none; color: #6b7178; cursor: pointer; font: inherit;
		}
		.rf-group__title { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #6b7178; white-space: nowrap; text-transform: uppercase; }
		.rf-group__header--added .rf-group__title { color: var(--rf-accent); }
		.rf-group__pill { padding: 2px 8px; border-radius: 999px; background: #e6f1fe; color: var(--rf-accent); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; }
		.rf-group__rule { flex: 1 1 auto; height: 1px; background: #eef1f5; }
		.rf-group__count { color: #b1bbc7; font-size: 12px; font-weight: 600; }
		.rf-chevron { color: #9aa4b1; transition: transform 0.15s ease; }
		.rf-chevron.is-collapsed { transform: rotate(-90deg); }
		.room-card {
			display: flex; align-items: center; gap: 10px; padding: 14px 8px;
			border-radius: 12px; cursor: pointer; position: relative;
		}
		.room-card--selected { margin: 3px 0; padding: 8px 8px; border: 2px solid var(--rf-accent); border-radius: 12px; background: #f2f8ff; }
		.room-card--ineligible .room-card__avatar,
		.room-card--ineligible .room-card__name,
		.room-card--ineligible .room-card__meta { opacity: 0.5; }
		/* The map's selection (the ticket's persistent highlight): a 3px accent
		   rail, a tint and a lift, so it never relies on colour alone. */
		.room-card[aria-current="true"] {
			background: #eef5fe;
			box-shadow: inset 3px 0 0 var(--rf-accent), 0 1px 4px rgba(29, 39, 57, 0.12);
		}
		.room-card__avatar { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px; }
		.room-card__body { flex: 1 1 auto; min-width: 0; }
		.room-card__name { font-size: 13px; font-weight: 700; color: #1d2739; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.room-card__meta { display: flex; align-items: center; gap: 4px; margin-top: 4px; color: #6b7178; font-size: 11px; min-width: 0; }
		.room-card__meta svg { color: #9aa4b1; flex: none; }
		.room-card__dot { color: #b1bbc7; }
		.room-card__action {
			flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
			width: 34px; height: 34px; padding: 0; border: 1.5px solid var(--rf-accent); border-radius: 50%;
			background: #fff; color: var(--rf-accent); cursor: pointer;
		}
		.room-card__action:hover { background: #e6f1fe; }
		.room-card__action--selected { border-color: var(--rf-accent); background: var(--rf-accent); color: #fff; }
		.room-card__action--selected:hover { background: #0057c2; }
		#log {
			position: fixed;
			right: 0;
			top: 0;
			width: calc(100% - 440px);
			height: 100vh;
			margin: 0;
			padding: 10px;
			overflow-y: auto;
			background: #0f172a;
			color: #a5f3a5;
			font: 12px/1.5 ui-monospace, Menlo, monospace;
			white-space: pre-wrap;
		}
	</style>
</head>
<body>
	<div class="pane">
		<div id="map"></div>
		<div class="list"><div class="handle" aria-hidden="true"></div><div id="list"></div></div>
	</div>
	<pre id="log"></pre>
	<script type="module" src="./omx.ts"></script>
</body>
</html>
